name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  no-client-leak:
    name: No client leak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This repo is public. Detection is by SHAPE, never by name: a list of customer
      # names committed here would itself be the leak it is meant to prevent, and
      # obfuscating that list only fools full-text search, not a reader.
      # scripts/check_no_client_leak.py is copied byte-for-byte from the canonical
      # source (Statyx/Fab-Analyze-Data-Agent@6e4a65e7) — do not edit it locally.
      - name: Structural scan (GUIDs, Fabric endpoints, personal paths)
        run: python scripts/check_no_client_leak.py

      # Name-based detection is preserved, but the names live in a secret, never in
      # the source tree. Secret missing (forks, external PRs) -> warning, still green.
      - name: Client deny-list scan (from secret, optional)
        env:
          CLIENT_DENYLIST: ${{ secrets.CLIENT_DENYLIST }}
        run: python scripts/check_client_denylist.py

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
