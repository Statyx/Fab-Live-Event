  - { id: "ZONE-EXPO",    name: "Hall Expo",        room_type: "Exhibition",  surface_m2: 3500, capacity: 5000, premium: false }
  - { id: "ZONE-STARTUP", name: "Startup Alley",    room_type: "Exhibition",  surface_m2: 900,  capacity: 1200, premium: false }
  - { id: "ZONE-LAB",     name: "Workshop Labs",    room_type: "Workshop",    surface_m2: 600,  capacity: 400,  premium: false }
  - { id: "ZONE-ASPEN",   name: "Salle Aspen",      room_type: "Conference",  surface_m2: 450,  capacity: 600,  premium: true }
  - { id: "ZONE-BILAT",   name: "Bilaterales",      room_type: "Business",    surface_m2: 300,  capacity: 120,  premium: false }
  - { id: "ZONE-FOOD",    name: "Food Court",       room_type: "Catering",    surface_m2: 800,  capacity: 1000, premium: false }
  - { id: "ZONE-VIP",     name: "VIP Lounge",       room_type: "VIP",         surface_m2: 250,  capacity: 200,  premium: true }

customers:
