  - { id: "SES-BEAUTY",  name: "Beauty & AI",           zone_id: "ZONE-ASPEN",   capacity: 600,  track: "Retail",   sponsor_id: "CUST-002" }
  - { id: "SES-CITY",    name: "Smart City 2030",       zone_id: "ZONE-ASPEN",   capacity: 600,  track: "Public",   sponsor_id: "CUST-006" }
  - { id: "SES-KEYNOTE", name: "Opening Keynote",       zone_id: "ZONE-AUD",     capacity: 2000, track: "Keynote",  sponsor_id: "CUST-001" }
  - { id: "SES-SPORT",   name: "Sport & Data",          zone_id: "ZONE-LAB",     capacity: 400,  track: "Retail",   sponsor_id: "CUST-003" }
  - { id: "SES-FINANCE", name: "FinTech Frontiers",     zone_id: "ZONE-BILAT",   capacity: 120,  track: "Finance",  sponsor_id: "CUST-004" }
