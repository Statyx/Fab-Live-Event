# Live Event Center — Configuration (EXAMPLE)
# LEC demo: Fabric Graph + Ontology + Operations Agent over live event-operations data.
# Copy this file to config.yaml and fill in your own capacity_id and tenant_id.

workspace_name: "Live Event Center"
capacity_id: "<YOUR_FABRIC_CAPACITY_ID>"               # GUID of your Fabric (F-SKU) capacity
fabric_api_base: "https://api.fabric.microsoft.com/v1"
tenant_id: "<YOUR_TENANT_ID>"                          # your Entra tenant GUID
# az_subscription: "<YOUR_AZ_SUBSCRIPTION_NAME>"       # optional: deploy_all.py runs `az account set` with this

# ── Items ────────────────────────────────────────────────────────
lakehouse_name: "LH_Event_Topology"
eventhouse_name: "EH_Event_Telemetry"
kql_db_name: "EventTelemetry"
ontology_name: "ONT_Event_KnowledgeGraph"
data_activator_name: "RX_Event_Alerts"
operations_agent_name: "Event_Operations_Agent"
report_name: "RPT_Event_Ops"

culprit_gate: "GATE-05"

kql_tables:
  telemetry_kpi:
    name: telemetry_kpi
    columns:
      - { name: timestamp,   type: datetime }
      - { name: zone_id,     type: string }
      - { name: gate_id,     type: string }
      - { name: kpi_name,    type: string }
      - { name: value,       type: real }
  telemetry_queue:
    name: telemetry_queue
    columns:
      - { name: timestamp,     type: datetime }
      - { name: gate_id,       type: string }
      - { name: zone_id,       type: string }
      - { name: wait_time_s,   type: real }
      - { name: in_count,      type: long }
      - { name: out_count,     type: long }
  alarms:
    name: alarms
    columns:
      - { name: timestamp,   type: datetime }
      - { name: gate_id,     type: string }
      - { name: alarm_type,  type: string }
      - { name: severity,    type: string }
      - { name: state,       type: string }
  event_logs:
    name: event_logs
    columns:
      - { name: timestamp,   type: datetime }
      - { name: gate_id,     type: string }
      - { name: severity,    type: string }
      - { name: message,     type: string }

telemetry:
  window_hours: 24
  interval_min: 15
  storm_start_min: 1080
  storm_duration_min: 90
  kpi_names: ["occupancy_pct", "people_count", "density_index", "utilization_m2_pct", "comfort_index"]

edition:
  id: "AMGFL26"
  name: "AutoMobility & AI Global Forum 2026"
  venue: "Paris Expo — Porte de Versailles"
  city: "Paris"
  edition_type: "Flagship"

